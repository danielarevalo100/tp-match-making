name: gaming-platform

services:
  redis:
    image: redis:7.4
    container_name: gaming-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - gaming-network

  mongodb:
    image: mongo:8.0
    container_name: gaming-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-gaming_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_local_only}
      MONGO_INITDB_DATABASE: gaming
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/001-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_ROOT_USERNAME:-gaming_admin}",
          "--password",
          "${MONGO_ROOT_PASSWORD:-change_me_local_only}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - gaming-network

  cassandra:
    image: cassandra:5.0
    container_name: gaming-cassandra
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./infra/cassandra/init.cql:/opt/gaming/init.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks:
      - gaming-network

  neo4j:
    image: neo4j:5-community
    container_name: gaming-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change_me_local_only}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infra/neo4j/init.cypher:/opt/gaming/init.cypher:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - gaming-network

  gaming-app:
    build:
      context: ./gamingApp
    container_name: gaming-app
    environment:
      SERVICE_NAME: gaming-app
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-gaming_admin}:${MONGO_ROOT_PASSWORD:-change_me_local_only}@mongodb:27017/gaming?authSource=admin
      MONGODB_DB_NAME: gaming
      MONGODB_CONNECT_RETRIES: 15
      MONGODB_RETRY_DELAY_MS: 2000
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_RETRIES: 15
      REDIS_RETRY_DELAY_MS: 2000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GAMING_APP_PORT:-3001}:3000"
    restart: unless-stopped
    networks:
      - gaming-network

networks:
  gaming-network:
    name: gaming-network
    driver: bridge

volumes:
  redis_data:
  mongo_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
